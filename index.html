<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Play Doom with JS-DOS</title>
<!-- Load js-dos-api.js from your GitHub repo via jsDelivr CDN -->
<script src="https://nunya-bidness.github.io/html-doom/js-dos-api.js"></script>
<style>
body,html{margin:0;padding:0;height:100%;overflow:hidden}
#doomContainer{width:100vw;height:100vh}
</style>
</head>
<body>
<div id="doomContainer"  style="width: 100%; height: 100%; border: 0px solid #000;"></div>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var dosbox = new Dosbox({
      id: "doomContainer",
      onload: function(dos) {
        dos.run("https://nunya-bidness.github.io/html-doom/DOOM-@evilution.zip", "./DOOM/DOOM.EXE");
      }
    });
  });
</script>
</body>
</html>
